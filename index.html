<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <main>
        <header>
            <div id="top">
                <h1>Find your film</h1>
                <a href="watchlist.html" id="watchlist-link">My Watchlist</a>
            </div>
            <form id="form">
                <div id="icon-input-container">
                    <img src="search-icon.svg">
                    <label for="search-input">Search for a movie</label>
                    <input type="text" placeholder="Search for a movie" id="search-input">
                </div>
                <button type="submit">Search</button>
            </form>
        </header>

        <section id="movies-container">
            <img src="reel.png" id="film-strip-icon">
            <p>Start exploring</p>
        </section>
    </main>
    <script src="index.js" type="module"></script>
</body>

</html>
